[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlo"
version = "0.1.0"
description = "Research loop orchestrator: Claude authors, a second model reviews, humans gate."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
models = ["anthropic>=1.0", "openai>=1.50"]

[project.scripts]
rlo = "rlo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
